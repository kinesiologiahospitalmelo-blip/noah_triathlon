<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F0E8" />
    <meta
      name="description"
      content="NOAH Coach — Never Over, Always Higher. Plataforma de entrenamiento y seguimiento de atletas."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOAH" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Fuentes del estilo nuevo (Opción 1): Archivo (UI) + IBM Plex Mono (datos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>NOAH Coach</title>
    <!-- Splash inline: se pinta al instante (antes de que cargue el JS) con el mismo
         fondo marfil que PantallaCarga v2, para que nunca aparezca otra pantalla. -->
    <style>
      html,body{margin:0;background:#F3F0E8}
      #noah-boot{position:fixed;inset:0;z-index:9998;background:#F3F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Archivo',system-ui,-apple-system,sans-serif}
      #noah-boot b{font-size:34px;font-weight:800;letter-spacing:11px;color:#292D29;margin-right:-11px}
      #noah-boot i{font-style:normal;font-size:9.5px;letter-spacing:2.6px;text-transform:uppercase;font-weight:700;color:rgba(41,45,41,.5);margin-top:9px}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="noah-boot"><b>NOAH</b><i>Never Over, Always Higher</i></div>
