name: Recalcular HRV + HANNA LIFE (manual)

# Recálculo de un toque, sin PC:
#   1) HRV estimado (vecino cercano / modo sin-HRV) por atleta, sobre todo el
#      historial.
#   2) HANNA LIFE + riesgo viral de TODOS los atletas, sobre todo el historial.
# Útil después de la migración de la columna hrv_rmssd, para dejar todo limpio.
# Se dispara a mano desde la pestaña Actions -> este workflow -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      atletas:
        description: 'IDs de atletas (separados por espacio) para el HRV estimado'
        required: false
        default: '1 2 3 4 5'

concurrency:
  group: recalcular-hrv-hanna
  cancel-in-progress: false

jobs:
  recalcular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: 1) HRV estimado (por atleta, todo el historial)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ATLETAS="${{ github.event.inputs.atletas || '1 2 3 4 5' }}"
          echo "Recalculando HRV estimado de: $ATLETAS"
          for A in $ATLETAS; do
            echo "--- atleta $A ---"
            python noah_hrv_estimado.py --atleta "$A" --todo || echo "atleta $A fallo, sigo"
          done

      - name: 2) HANNA LIFE + riesgo viral (todos, todo el historial)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python noah_hanna_life.py --todos --todo
