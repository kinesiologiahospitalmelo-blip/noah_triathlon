name: Sync Garmin PESADO NOAH

# Sincronizacion COMPLETA (bio + actividades + streams de potencia/IF/NP + perf)
# de TODOS los atletas, 3 veces al dia. El backfill de streams ya es a prueba de
# cortes (cooldown + tope + corte en 429), asi que cada corrida termina rapido y
# lo que no bajo lo retoma la corrida siguiente.
# El BOTON del atleta NO usa este workflow: usa la cola (modo rapido), que es veloz.

on:
  schedule:
    # 3 tiros al dia. Horas UTC (Buenos Aires = UTC-3):
    - cron: '0 12 * * *'   # 09:00 ART
    - cron: '0 18 * * *'   # 15:00 ART
    - cron: '0 0  * * *'   # 21:00 ART
  workflow_dispatch:        # boton "Run workflow" para forzar una corrida
    inputs:
      dias:
        description: 'Dias hacia atras a bajar (catch-up manual; default 7)'
        required: false
        default: '14'

# Evita que dos corridas pesadas se pisen (si una se atrasa, la siguiente espera)
concurrency:
  group: sync-garmin-pesado
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # tope duro: nunca se queda colgado
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect psycopg2-binary pandas numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Sincronizar (todos los atletas)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Programado: 7 dias (red de seguridad semanal). Manual: el valor que
          # elijas (default 14) para un catch-up grande y "quedar en cero".
          # El backfill de streams (potencia/IF/NP) mira 14 dias igual y es a
          # prueba de cortes (cooldown + tope + corte en 429).
          DIAS="${{ github.event.inputs.dias || '7' }}"
          echo "Sincronizando ultimos $DIAS dias de TODOS los atletas"
          python sincronizar_garmin.py --modo todo --dias "$DIAS"
