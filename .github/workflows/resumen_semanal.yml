name: Resumen semanal NOAH

on:
  schedule:
    - cron: '0 11 * * 1'       # lunes 11:00 UTC = 08:00 Buenos Aires (va a TODOS)
  workflow_dispatch:            # botón "Run workflow" para probar
    inputs:
      modo:
        description: 'Modo de envio'
        type: choice
        default: prueba
        options:
          - prueba
          - todos

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Enviar resumen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.modo }}" = "todos" ]; then
            echo "Envio REAL a todos los atletas"
            python enviar_resumen_semanal.py
          else
            echo "Modo PRUEBA: todo va solo a tu casilla"
            python enviar_resumen_semanal.py --prueba kinesiologia.hospital.melo@gmail.com
          fi
